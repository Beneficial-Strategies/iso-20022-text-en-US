name: Label the language variety

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            // The forms ask "Language variety"; an option like "Brazil (pt-BR)" becomes the label variety:pt-BR,
            // so that demand for a variety can be counted (issues?q=label:variety:pt-BR).
            const m = (issue.body || '').match(/### Language variety\s*\n+([^\n]+)/);
            if (!m) { core.info('No variety on this issue.'); return; }
            const choice = m[1].trim();
            const tag = choice.match(/\(([a-z]{2,3}-[A-Za-z0-9]{2,8})\)/);
            const wanted = tag ? `variety:${tag[1]}` : (/^Other/i.test(choice) ? 'variety:other' : null);
            const current = issue.labels.map(l => l.name).filter(n => n.startsWith('variety:'));
            for (const stale of current.filter(n => n !== wanted)) {
              await github.rest.issues.removeLabel({...context.repo, issue_number: issue.number, name: stale});
            }
            if (!wanted || current.includes(wanted)) { return; }
            try {
              await github.rest.issues.createLabel({...context.repo, name: wanted, color: '1d76db',
                description: 'Needs or concerns this language variety; counts demand for a regional text'});
            } catch (e) { if (e.status !== 422) throw e; }
            await github.rest.issues.addLabels({...context.repo, issue_number: issue.number, labels: [wanted]});
            core.info(`Labelled ${wanted}.`);
